# Rebuilds the trip packs (Pro): every mapped plate reader and speed camera per US state, from
# OpenStreetMap via Overpass, uploaded to the worker's KV namespace. Runs nightly and on demand.
#
# Needs the same CLOUDFLARE_API_TOKEN secret as the deploy workflow, and the KV namespace that the
# deploy workflow creates (deploy at least once first).
name: Build trip packs

on:
  schedule:
    - cron: "23 7 * * *" # 07:23 UTC, the small hours in the US
  workflow_dispatch:
    inputs:
      states:
        description: "Only these states, space separated (blank = all)"
        required: false
        default: ""

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KV_TITLE: flock-off-packs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Read the API token
        run: |
          token="$(printf '%s' "$RAW_CF_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -1 || true)"
          if [ -z "$token" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first."; exit 1; fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

      - run: npm ci
        working-directory: worker

      - name: Find the KV namespace
        working-directory: worker
        run: |
          id="$(npx wrangler kv namespace list | sed -n '/^\[/,$p' | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id' | head -1)"
          if [ -z "$id" ]; then echo "::error::KV namespace $KV_TITLE not found. Run the deploy workflow first."; exit 1; fi
          echo "CF_KV_NAMESPACE=$id" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT_ID=$(grep -oE '"account_id": *"[0-9a-f]{32}"' wrangler.jsonc | grep -oE '[0-9a-f]{32}')" >> "$GITHUB_ENV"

      # Uploads each state to KV as soon as it is built and stops starting new states after
      # BUDGET_MIN minutes, so a slow Overpass night still publishes what it finished.
      - name: Build and upload packs
        env:
          STATES: ${{ inputs.states }}
          BUDGET_MIN: "70"
        run: node scripts/build-packs.mjs packs-out $STATES

      - name: Summary
        if: always()
        run: |
          [ -f packs-out/index.json ] || exit 0
          {
            echo "### Trip packs"
            echo ""
            jq -r '"\(.states | length) states published, \([.states[].count] | add // 0) cameras. Failed this run: \(.failed | join(" "))"' packs-out/index.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: packs-out/*.json
          retention-days: 7
